<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- 🔵 Кольцо: задняя половина (за буквой D) -->
    <clipPath id="ringFront">
      <rect x="0" y="111" width="200" height="89" />
    </clipPath>
    <!-- 🔷 Форма D (evenodd: внешний контур + внутренняя дыра) -->
    <clipPath id="dClip" transform="translate(12,26) scale(0.85)">
      <path d="M14 18 H94 L126 30 L148 50 L170 38 L166 72 L188 86 L166 112 L180 136 L152 158 L122 176 L94 182 L14 182 Z M50 56 H96 L116 76 L124 100 L116 124 L96 144 L50 144 Z" fill-rule="evenodd" clip-rule="evenodd" />
    </clipPath>
  </defs>

  <!-- 1️⃣ Кольцо — задняя половина (за D) -->
  <ellipse cx="98" cy="111" rx="86" ry="82" transform="rotate(-12 98 111)"
           fill="none" stroke="#4f9bff" stroke-width="3" opacity="0.95" />

  <!-- 2️⃣ Буква D (low-poly facets) -->
  <g transform="translate(12,26) scale(0.85)">
    <!-- Заливка-основа (чтобы не было дыр между гранями) -->
    <path d="M14 18 H94 L126 30 L148 50 L170 38 L166 72 L188 86 L166 112 L180 136 L152 158 L122 176 L94 182 L14 182 Z M50 56 H96 L116 76 L124 100 L116 124 L96 144 L50 144 Z"
          fill-rule="evenodd" fill="#1546dd" />
    <!-- Грани -->
    <g clip-path="url(#dClip)">
      <!-- ➖ ствол (тёмно-синий) -->
      <polygon points="14,18 50,56 32,96" fill="#1f6fe0" stroke="rgba(255,255,255,0.55)" stroke-width="1" />
      <polygon points="14,18 32,96 14,182" fill="#1140b8" stroke="rgba(255,255,255,0.55)" stroke-width="1" />
      <polygon points="32,96 50,144 14,182" fill="#0a2a8f" stroke="rgba(255,255,255,0.55)" stroke-width="1" />
      <polygon points="50,56 50,144 32,96" fill="#2f8cf0" stroke="rgba(255,255,255,0.55)" stroke-width="1" />
      <!-- ➖ верх -->
      <polygon points="14,18 94,18 50,56" fill="#4f9bff" stroke="rgba(255,255,255,0.55)" stroke-width="1" />
      <polygon points="94,18 96,56 50,56" fill="#2f8cf0" stroke="rgba(255,255,255,0.55)" stroke-width="1" />
      <polygon points="94,18 126,30 96,56" fill="#7cc0fb" stroke="rgba(255,255,255,0.55)" stroke-width="1" />
      <polygon points="126,30 116,76 96,56" fill="#4f9bff" stroke="rgba(255,255,255,0.55)" stroke-width="1" />
      <polygon points="126,30 148,50 116,76" fill="#7cc0fb" stroke="rgba(255,255,255,0.55)" stroke-width="1" />
      <!-- 🗡️ правые шарды (очень светло-синие) -->
      <polygon points="148,50 170,38 116,76" fill="#a9d8fd" stroke="rgba(255,255,255,0.55)" stroke-width="1" />
      <polygon points="170,38 166,72 116,76" fill="#7cc0fb" stroke="rgba(255,255,255,0.55)" stroke-width="1" />
      <polygon points="166,72 188,86 124,100" fill="#cfe8ff" stroke="rgba(255,255,255,0.55)" stroke-width="1" />
      <polygon points="166,72 124,100 116,76" fill="#4f9bff" stroke="rgba(255,255,255,0.55)" stroke-width="1" />
      <polygon points="188,86 166,112 124,100" fill="#a9d8fd" stroke="rgba(255,255,255,0.55)" stroke-width="1" />
      <polygon points="166,112 180,136 124,100" fill="#7cc0fb" stroke="rgba(255,255,255,0.55)" stroke-width="1" />
      <polygon points="166,112 116,124 124,100" fill="#4f9bff" stroke="rgba(255,255,255,0.55)" stroke-width="1" />
      <polygon points="166,112 180,136 116,124" fill="#4f9bff" stroke="rgba(255,255,255,0.55)" stroke-width="1" />
      <polygon points="180,136 152,158 116,124" fill="#7cc0fb" stroke="rgba(255,255,255,0.55)" stroke-width="1" />
      <!-- ➖ низ -->
      <polygon points="152,158 96,144 116,124" fill="#2f8cf0" stroke="rgba(255,255,255,0.55)" stroke-width="1" />
      <polygon points="152,158 122,176 96,144" fill="#1f6fe0" stroke="rgba(255,255,255,0.55)" stroke-width="1" />
      <polygon points="122,176 94,182 96,144" fill="#1f6fe0" stroke="rgba(255,255,255,0.55)" stroke-width="1" />
      <polygon points="50,144 96,144 94,182" fill="#1546dd" stroke="rgba(255,255,255,0.55)" stroke-width="1" />
      <polygon points="94,182 14,182 50,144" fill="#1140b8" stroke="rgba(255,255,255,0.55)" stroke-width="1" />
    </g>
  </g>

  <!-- 3️⃣ Корона (золотая, low-poly, слева-сверху) -->
  <g transform="translate(30,0)">
    <!-- Основание (тёмно-золотое) -->
    <rect x="0" y="33" width="70" height="8" fill="#e8a317" />
    <!-- Пики (low-poly, 3 штуки) -->
    <!-- Пик 1 -->
    <polygon points="0,33 20,33 10,8" fill="#f5c542" />
    <polygon points="10,8 10,33 20,33" fill="#ffde6b" />
    <!-- Пик 2 (центральный, самый высокий) -->
    <polygon points="20,33 45,33 32,0" fill="#f5c542" />
    <polygon points="32,0 32,33 45,33" fill="#ffde6b" />
    <!-- Пик 3 -->
    <polygon points="45,33 70,33 58,12" fill="#f5c542" />
    <polygon points="58,12 58,33 70,33" fill="#ffde6b" />
    <!-- Шарики на вершинах (светло-жёлтые) -->
    <circle cx="10" cy="8" r="3.2" fill="#fff3b0" stroke="#e8a317" stroke-width="0.8" />
    <circle cx="32" cy="0" r="3.4" fill="#fff3b0" stroke="#e8a317" stroke-width="0.8" />
    <circle cx="58" cy="12" r="3.2" fill="#fff3b0" stroke="#e8a317" stroke-width="0.8" />
    <!-- Самоцветы на ободе (синие) -->
    <polygon points="10,37 13,40 10,43 7,40" fill="#2f8cf0" stroke="#1d4ed8" stroke-width="0.6" />
    <polygon points="32,37 35,40 32,43 29,40" fill="#2f8cf0" stroke="#1d4ed8" stroke-width="0.6" />
    <polygon points="58,37 61,40 58,43 55,40" fill="#2f8cf0" stroke="#1d4ed8" stroke-width="0.6" />
  </g>

  <!-- 4️⃣ Кольцо — передняя нижняя половина (поверх D) -->
  <g clip-path="url(#ringFront)">
    <ellipse cx="98" cy="111" rx="86" ry="82" transform="rotate(-12 98 111)"
             fill="none" stroke="#4f9bff" stroke-width="3" opacity="0.95" />
  </g>
</svg>