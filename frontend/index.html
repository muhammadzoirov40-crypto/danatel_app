    <style>

    </style>
    <!-- 🔄 Худкор бозхонӣ v4 (18.11.2026 — скриншотҳои соҳиб: логотип +
         нуқтаҳо мемонад + «abnovid nameshavad» — намеҳамворакад):
         v3 (16.11) қоидаи (3)-ро аз ЛАҲЗАИ ОҒОЗИ САҲИФА (t0) ҳисоб мекард:
         «скрипт омад → ≥6s» — вале дар роҳи суст худи БОРГИРИИ бандл
         (160KB) зиёда аз6s тӯл мекашад → дарҳоли тамом шудан (loaded) дар
         el>6s, React ҳанӯз нанишаста → ҳар тикси баъдӣ бозхонӣ → ҳалқаи
         такрор (дар телефон = ҳамеша) → «3 аз 3» → саҳифа ҲЕҶГОҲ кушода
         НАМЕШАВАД → UpdateToast кор намегирад → «навсозӣ намешавад».
         v4 — сабаби асосӣ ислоҳ шуд:
         (1) Дарҳоли фаъол (дариозиши бандл) → БОЗХОНӢ НАМЕКУНАД → 60s:
             матн + ТУГМАИ «Аз нав кӯшиш» (пешрафти боргирӣ нобуд НАМЕШАВАД);
             агар дархост ҷӯд шавад → хатои Chrome → бандли (2) худкор;
         (2) Шикасти дархости скрипт → бозхонии зуд (≥1.5s);
         (3) Бандл ПУРРА шуд, вале React ҳанӯз НАНИШАСТ → танҳо12s баъд
             АЗ ЛАҲЗАИ ПУРРА ШУДАН (load event) → бозхонӣ (хатои иҷро);
         (4) Скрипт ёфт нашуд / иҷро нашуд → 15s баъд бозхонӣ;
         (5) Ҳамаи кӯшишҳо тамом → матн + ТУГМА (барои телефон: touch).
         Дар давоми боргирӣ >10s: «Боргирӣ идома дорад — сабр кунед…»
         (ихтиёрӣ, на танҳо ҳангоми такрор) — соҳиб «ҳеч чиз намеёбад» гуфт.
         sessionStorage = шумораи такрорҳо (ҳалқаи беҳуда манъ); ҳангоми
         муваффақият пардохт пок мешавад → дар оянда ҳам такрор мемонад. -->
    <script>
      (function () {
        try {
          var KEY = "boot_retry_n";
          var MAX = 3;
          var n = 0;
          try {
            n = parseInt(sessionStorage.getItem(KEY) || "0", 10) || 0;
          } catch (e) {}
          if (n < 0 || n > MAX) n = 0;
          var t0 = Date.now();
          var loadAt = 0; // лаҳзаи пурра шудани боргирии скрипти асосӣ
          var failed = false;
          var loaded = false;
          var done = false;
          var markLoaded = function () {
            if (loaded) return;
            loaded = true;
            loadAt = Date.now();
          };
          var mounted = function () {
            return !document.querySelector(".boot");
          };
          var say = function (text) {
            var boot = document.querySelector(".boot");
            if (!boot) return null;
            var s = document.getElementById("boot-status");
            if (!s) {
              s = document.createElement("p");
              s.id = "boot-status";
              s.className = "boot-status";
              s.setAttribute("role", "status");
              boot.appendChild(s);
            }
            s.textContent = text;
            return s;
          };
          // (2) Шикасти дархост (скрипт/лимс) — capture, дарҳол маълум
          window.addEventListener(
            "error",
            function (ev) {
              var t = ev.target;
              if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK")) failed = true;
            },
            true
          );
          // window «load» = ҳамаи захираҳо (аз ҷумла бандл) тайёр —
          // воситаи асосии донистани «боргирӣ тамом шуд»;
          // скрипти худ ҳам (агар пештар пайваст шуда бошад) ҳамонро мегӯяд.
          window.addEventListener("load", markLoaded);
          var pending = function () {
            if (document.readyState === "loading") return true;
            var m = document.querySelector("script[type=module]");
            if (!m || loaded || failed) return false;
            if (!m._bootWatch) {
              m._bootWatch = true;
              m.addEventListener("load", markLoaded);
              m.addEventListener("error", function () {
                failed = true;
              });
            }
            return true;
          };
          var final = function () {
            if (done) return;
            done = true;
            say("Боргирӣ қатъ шуд — интернетро санҷед.");
            var boot = document.querySelector(".boot");
            if (!boot || document.getElementById("boot-retry-btn")) return;
            var b = document.createElement("button");
            b.id = "boot-retry-btn";
            b.type = "button";
            b.className = "boot-retry-btn";
            b.textContent = "🔄 Аз нав кӯшиш кунед";
            b.addEventListener("click", function () {
              try {
                sessionStorage.removeItem(KEY);
              } catch (e) {}
              // 20.11.2026: SW-и вайрон ё кэши камтаом сабаби «қатъ шуд» аст
              // (iPhone/iOS низ) — пеш аз бозхонӣ онҳоро тоза мекунем
              try {
                var jobs = [];
                if ("serviceWorker" in navigator)
                  jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                    return Promise.all(rs.map(function (r) { return r.unregister(); }));
                  }));
                if (window.caches)
                  jobs.push(caches.keys().then(function (ks) {
                    return Promise.all(ks.map(function (k) { return caches.delete(k); }));
                  }));
                Promise.all(jobs).then(function () { location.reload(); },
                                        function () { location.reload(); });
              } catch (e) { location.reload(); }
            });
            boot.appendChild(b);
          };
          var reloadNow = function () {
            if (done) return;
            if (n >= MAX) return final();
            var ok = true;
            try {
              sessionStorage.setItem(KEY, String(n + 1));
            } catch (e) {
              ok = false;
            }
            if (ok) location.reload();
            else final();
          };
          var said = false;
          var iv = setInterval(function () {
            if (mounted()) {
              clearInterval(iv);
              try {
                sessionStorage.removeItem(KEY);
              } catch (e) {}
              return;
            }
            if (!said && !done) {
              var el = Date.now() - t0;
              if (n > 0) {
                said = true;
                say("Такрори боргирӣ " + n + " аз " + MAX + "…");
              } else if (el > 10000) {
                said = true;
                say("Боргирӣ идома дорад — сабр кунед…");
              }
            }
          }, 1000);
          var ck = setInterval(function () {
            if (mounted() || done) return;
            var el = Date.now() - t0;
            if (failed && el > 1500) return reloadNow(); // (2)
            if (loaded) {
              // (3) бандл ПУРРА шуд → иҷро мешавад: танҳо12s баъд АЗ
              // лаҳзаи пурра шудан, вагарна САБР (15-20s боргирӣ = одӣ!)
              if (Date.now() - loadAt > 12000) return reloadNow();
              return;
            }
            if (pending()) {
              if (el > 60000) final(); // (1) НОБОЗХОНИИ иттилоотӣ + тугма
            } else if (el > 15000) {
              reloadNow(); // (4) скрипт ёфт нашуд/вогузор нашуд
            }
          }, 2000);
        } catch (e) { /* беҳатар */ }
      })();
    </script>
    <script>
      // 🌙 Мавзӯи нигоҳдоришуда → ПЕШ аз аввали ранг (бе "флеш"-и сафед)
      //    ?theme=dark | light — пайванди мустақим (масалан барои санҷиш)
      try {
        var q = new URLSearchParams(location.search).get("theme");
        if (q === "dark" || q === "light") localStorage.setItem("danatel_theme", q);
        var dark = localStorage.getItem("danatel_theme") === "dark";
        if (dark) document.documentElement.classList.add("dark");
        var tm = document.getElementById("theme-color-meta");
        if (tm) tm.setAttribute("content", "#010A27");
      } catch (e) {}
    </script>

    <style>
      /* ============ 🚀 BRANDED SPLASH (web, first paint) ============ */

      }
      .splash-logo-sweep::before {
        content: "";
        position: absolute;
        top: -25%;
        bottom: -25%;

        width: 34%;
        background: linear-gradient(
          105deg,
          transparent,
          rgba(255, 255, 255, 0.8),
          transparent
        );
        /* normal compositing: real alpha */
        transform: translateX(-150%) skewX(-18deg);
        animation: splash-sweep 2.2s ease-in-out infinite;

      }
      .splash-wordmark {
        position: absolute;
        left: 17.6%;

      .splash-wordmark-shimmer {

          rgba(255, 255, 255, 0.85),
          transparent
        );
        /* normal compositing: real alpha */
        transform: translateX(-180%) skewX(-16deg);
        animation: splash-shimmer 2.5s ease-in-out infinite;

      }
      .splash-sparks {
        position: absolute;

      .splash-sparks i {

      @media (prefers-reduced-motion: reduce) {

        #splash.is-done { transform: none; }
      }

    <!-- ============ 🚀 SPLASH (plain HTML, paints before JS) ============ -->

      <div class="splash-stage" aria-hidden="true">
        <div class="splash-glow"></div>
        <div class="splash-logo">
          <div class="splash-logo-float">
            <div class="splash-logo-box">
              <img src="/splash/splash_logo.webp" alt="" fetchpriority="high" decoding="sync" />

            </div>
          </div>
        </div>
        <div class="splash-wordmark">
          <div class="splash-wordmark-box">
            <img src="/splash/layer_wordmark.webp" alt="" fetchpriority="high" decoding="sync" />
            <span class="splash-wordmark-shimmer"></span>
          </div>
        </div>
        <div class="splash-sparks">
          <i style="--x:12%;--y:24%;--s:3px;--delay:.2s;--dur:2.6s"></i>
          <i style="--x:86%;--y:18%;--s:2px;--delay:1.1s;--dur:2.1s"></i>
          <i style="--x:8%;--y:62%;--s:2px;--delay:.7s;--dur:3.1s"></i>
          <i style="--x:92%;--y:55%;--s:3px;--delay:1.6s;--dur:2.4s"></i>
          <i style="--x:18%;--y:82%;--s:2px;--delay:.4s;--dur:2.8s"></i>
          <i style="--x:78%;--y:78%;--s:2px;--delay:1.3s;--dur:2.2s"></i>
          <i style="--x:50%;--y:15%;--s:2px;--delay:1.9s;--dur:3.0s"></i>
          <i style="--x:64%;--y:36%;--s:3px;--delay:.9s;--dur:2.5s"></i>
        </div>
        <div class="splash-progress"><span></span></div>

    </div>
    <div id="root">
      <!-- ⏳ Идомаи splash-и native (ҳамон D, ҳамон фон) — React онро иваз мекунад -->
      <div class="boot" role="status" aria-label="Боргирӣ">
        <img class="boot-logo" src="/donatshop-D-logo.png" alt="donatshop" />
        <noscript>
          <p class="boot-fallback">JavaScript кушода кунед — сайт бе он кор намекунад.</p>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      /* 🚀 Splash hand-off: React аввалин render кард (boot нест) → баъди
         ҳадди ақал 650ms ба 100% мерасад ва 300ms фейд мешавад. MAX 2.4s —
         ҳатто офлайн/хато низ splash ҳеҷ гоҳ овезон намемонад. */
      (function () {
        var s = document.getElementById("splash");
        var root = document.getElementById("root");
        if (!s || !root) return;
        var t0 = performance.now(), MIN = 650, MAX = 2400, done = false;
        var obs = null, iv = null;
        function setMeta() {
          var dark = document.documentElement.classList.contains("dark");
          var m = document.getElementById("theme-color-meta");
          if (m) m.setAttribute("content", dark ? "#000000" : "#F2F2F7");
        }
        function finish() {
          if (done) return;
          done = true;
          if (obs) obs.disconnect();
          if (iv) clearInterval(iv);
          var wait = Math.max(0, MIN - (performance.now() - t0));
          setTimeout(function () {
            s.classList.add("is-ready");
            setTimeout(function () {
              s.classList.add("is-done");
              document.documentElement.classList.remove("splash-active");
              setMeta();
              setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 330);
            }, 260);
          }, wait);
        }
        function check() {
          if (root.children.length > 0 && !root.querySelector(".boot")) {
            finish();
            return true;
          }
          return false;
        }
        try {
          obs = new MutationObserver(check);
          obs.observe(root, { childList: true, subtree: true });
        } catch (e) { /* кӯҳна браузер */ }
        iv = setInterval(check, 80);
        check();
        setTimeout(finish, MAX);
      })();
    </script>
  </body>
</html>
