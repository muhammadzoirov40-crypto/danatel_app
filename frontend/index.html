    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" /></noscript>
    <title>donatshop.tj — Донати бозиҳо</title>
    <!-- ⏳ Индиcатори боргирӣ — то замони пурра бор шудани JS (6-15 сония
         дар роҳҳои суст; экран сиёҳ/холӣ НАБОЯД бошад). React ҳамонавқт ки
         аввалин саҳифаро месозад, дохили #root-ро пурра иваз мекунад →
         индиcатор худкор нест мешавад. Матн надорад → забон умумӣ. -->
    <style>
      /* 🍎 Boot = идомаи splash-и native: ҳамон фон, ҳамон D, бе матн/прогресс */
      html, body { margin: 0; padding: 0; background: #F2F2F7; }
      html.dark, html.dark body { background: #000; }
      #root { min-height: 100vh; min-height: 100dvh; }
      .boot {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        background: #F2F2F7;
      }
      html.dark .boot { background: #000; }
      .boot-logo { width: 96px; height: 96px; object-fit: contain; }
      .boot-fallback {
        position: absolute;
        bottom: 24%;
        text-align: center;
        font-family: system-ui, sans-serif;
        color: #4a5578;
        font-size: 14px;
        max-width: 260px;
      }
      html.dark .boot-fallback { color: #aab6d8; }
      .boot-status {
        position: absolute;
        bottom: 16%;
        text-align: center;
        font: 600 12.5px/1.45 system-ui, sans-serif;
        color: #4a5578;
        max-width: 250px;
      }
      html.dark .boot-status { color: #aab6d8; }
      .boot-retry-btn {
        position: absolute;
        bottom: 8%;
        padding: 12px 24px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: #fff;
        font: 700 14px/1 system-ui, sans-serif;
        cursor: pointer;
        box-shadow: 0 10px 22px -10px rgba(37, 99, 235, 0.95);
      }
      .boot-retry-btn:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) {
        .boot-retry-btn { transition: none; }
      }
    </style>
    <!-- 🔄 Худкор бозхонӣ v4 (18.11.2026 — скриншотҳои соҳиб: логотип +
         нуқтаҳо мемонад + «abnovid nameshavad» — намеҳамворакад):
         v3 (16.11) қоидаи (3)-ро аз ЛАҲЗАИ ОҒОЗИ САҲИФА (t0) ҳисоб мекард:
         «скрипт омад → ≥6s» — вале дар роҳи суст худи БОРГИРИИ бандл
         (160KB) зиёда аз6s тӯл мекашад → дарҳоли тамом шудан (loaded) дар
         el>6s, React ҳанӯз нанишаста → ҳар тикси баъдӣ бозхонӣ → ҳалқаи
         такрор (дар телефон = ҳамеша) → «3 аз 3» → саҳифа ҲЕҶГОҲ кушода
         НАМЕШАВАД → UpdateToast кор намегирад → «навсозӣ намешавад».
         v4 — сабаби асосӣ ислоҳ шуд:
         (1) Дарҳоли фаъол (дариозиши бандл) → БОЗХОНӢ НАМЕКУНАД → 60s:
             матн + ТУГМАИ «Аз нав кӯшиш» (пешрафти боргирӣ нобуд НАМЕШАВАД);
             агар дархост ҷӯд шавад → хатои Chrome → бандли (2) худкор;
         (2) Шикасти дархости скрипт → бозхонии зуд (≥1.5s);
         (3) Бандл ПУРРА шуд, вале React ҳанӯз НАНИШАСТ → танҳо12s баъд
             АЗ ЛАҲЗАИ ПУРРА ШУДАН (load event) → бозхонӣ (хатои иҷро);
         (4) Скрипт ёфт нашуд / иҷро нашуд → 15s баъд бозхонӣ;
         (5) Ҳамаи кӯшишҳо тамом → матн + ТУГМА (барои телефон: touch).
         Дар давоми боргирӣ >10s: «Боргирӣ идома дорад — сабр кунед…»
         (ихтиёрӣ, на танҳо ҳангоми такрор) — соҳиб «ҳеч чиз намеёбад» гуфт.
         sessionStorage = шумораи такрорҳо (ҳалқаи беҳуда манъ); ҳангоми
         муваффақият пардохт пок мешавад → дар оянда ҳам такрор мемонад. -->
    <script>
      (function () {
        try {
          var KEY = "boot_retry_n";
          var MAX = 3;
          var n = 0;
          try {
            n = parseInt(sessionStorage.getItem(KEY) || "0", 10) || 0;
          } catch (e) {}
          if (n < 0 || n > MAX) n = 0;
          var t0 = Date.now();
          var loadAt = 0; // лаҳзаи пурра шудани боргирии скрипти асосӣ
          var failed = false;
          var loaded = false;
          var done = false;
          var markLoaded = function () {
            if (loaded) return;
            loaded = true;
            loadAt = Date.now();
          };
          var mounted = function () {
            return !document.querySelector(".boot");
          };
          var say = function (text) {
            var boot = document.querySelector(".boot");
            if (!boot) return null;
            var s = document.getElementById("boot-status");
            if (!s) {
              s = document.createElement("p");
              s.id = "boot-status";
              s.className = "boot-status";
              s.setAttribute("role", "status");
              boot.appendChild(s);
            }
            s.textContent = text;
            return s;
          };
          // (2) Шикасти дархост (скрипт/лимс) — capture, дарҳол маълум
          window.addEventListener(
            "error",
            function (ev) {
              var t = ev.target;
              if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK")) failed = true;
            },
            true
          );
          // window «load» = ҳамаи захираҳо (аз ҷумла бандл) тайёр —
          // воситаи асосии донистани «боргирӣ тамом шуд»;
          // скрипти худ ҳам (агар пештар пайваст шуда бошад) ҳамонро мегӯяд.
          window.addEventListener("load", markLoaded);
          var pending = function () {
            if (document.readyState === "loading") return true;
            var m = document.querySelector("script[type=module]");
            if (!m || loaded || failed) return false;
            if (!m._bootWatch) {
              m._bootWatch = true;
              m.addEventListener("load", markLoaded);
              m.addEventListener("error", function () {
                failed = true;
              });
            }
            return true;
          };
          var final = function () {
            if (done) return;
            done = true;
            say("Боргирӣ қатъ шуд — интернетро санҷед.");
            var boot = document.querySelector(".boot");
            if (!boot || document.getElementById("boot-retry-btn")) return;
            var b = document.createElement("button");
            b.id = "boot-retry-btn";
            b.type = "button";
            b.className = "boot-retry-btn";
            b.textContent = "🔄 Аз нав кӯшиш кунед";
            b.addEventListener("click", function () {
              try {
                sessionStorage.removeItem(KEY);
              } catch (e) {}
              // 20.11.2026: SW-и вайрон ё кэши камтаом сабаби «қатъ шуд» аст
              // (iPhone/iOS низ) — пеш аз бозхонӣ онҳоро тоза мекунем
              try {
                var jobs = [];
                if ("serviceWorker" in navigator)
                  jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                    return Promise.all(rs.map(function (r) { return r.unregister(); }));
                  }));
                if (window.caches)
                  jobs.push(caches.keys().then(function (ks) {
                    return Promise.all(ks.map(function (k) { return caches.delete(k); }));
                  }));
                Promise.all(jobs).then(function () { location.reload(); },
                                        function () { location.reload(); });
              } catch (e) { location.reload(); }
            });
            boot.appendChild(b);
          };
          var reloadNow = function () {
            if (done) return;
            if (n >= MAX) return final();
            var ok = true;
            try {
              sessionStorage.setItem(KEY, String(n + 1));
            } catch (e) {
              ok = false;
            }
            if (ok) location.reload();
            else final();
          };
          var said = false;
          var iv = setInterval(function () {
            if (mounted()) {
              clearInterval(iv);
              try {
                sessionStorage.removeItem(KEY);
              } catch (e) {}
              return;
            }
            if (!said && !done) {
              var el = Date.now() - t0;
              if (n > 0) {
                said = true;
                say("Такрори боргирӣ " + n + " аз " + MAX + "…");
              } else if (el > 10000) {
                said = true;
                say("Боргирӣ идома дорад — сабр кунед…");
              }
            }
          }, 1000);
          var ck = setInterval(function () {
            if (mounted() || done) return;
            var el = Date.now() - t0;
            if (failed && el > 1500) return reloadNow(); // (2)
            if (loaded) {
              // (3) бандл ПУРРА шуд → иҷро мешавад: танҳо12s баъд АЗ
              // лаҳзаи пурра шудан, вагарна САБР (15-20s боргирӣ = одӣ!)
              if (Date.now() - loadAt > 12000) return reloadNow();
              return;
            }
            if (pending()) {
              if (el > 60000) final(); // (1) НОБОЗХОНИИ иттилоотӣ + тугма
            } else if (el > 15000) {
              reloadNow(); // (4) скрипт ёфт нашуд/вогузор нашуд
            }
          }, 2000);
        } catch (e) { /* беҳатар */ }
      })();
    </script>
    <script>
      // 🌙 Мавзӯи нигоҳдоришуда → ПЕШ аз аввали ранг (бе "флеш"-и сафед)
      //    ?theme=dark | light — пайванди мустақим (масалан барои санҷиш)
      try {
        var q = new URLSearchParams(location.search).get("theme");
        if (q === "dark" || q === "light") localStorage.setItem("danatel_theme", q);
        var dark = localStorage.getItem("danatel_theme") === "dark";
        if (dark) document.documentElement.classList.add("dark");
        var tm = document.getElementById("theme-color-meta");
        if (tm) tm.setAttribute("content", dark ? "#000000" : "#F2F2F7");
      } catch (e) {}
    </script>

  </head>
  <body>
    <div id="root">
      <!-- ⏳ Идомаи splash-и native (ҳамон D, ҳамон фон) — React онро иваз мекунад -->
      <div class="boot" role="status" aria-label="Боргирӣ">
        <img class="boot-logo" src="/donatshop-D-logo.png" alt="donatshop" />
        <noscript>
          <p class="boot-fallback">JavaScript кушода кунед — сайт бе он кор намекунад.</p>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
