<!doctype html>
<html lang="tj">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="donatshop.tj — Донати бозиҳо: Free Fire, PUBG Mobile, Mobile Legends" />
    <meta name="theme-color" content="#1546dd" />
    <!-- 📦 PWA — насби барнома дар телефон (Install app / Add to Home Screen) -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="donatshop" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>donatshop.tj — Донати бозиҳо</title>
    <!-- ⏳ Индиcатори боргирӣ — то замони пурра бор шудани JS (6-15 сония
         дар роҳҳои суст; экран сиёҳ/холӣ НАБОЯД бошад). React ҳамонавқт ки
         аввалин саҳифаро месозад, дохили #root-ро пурра иваз мекунад →
         индиcатор худкор нест мешавад. Матн надорад → забон умумӣ. -->
    <style>
      html, body { margin: 0; padding: 0; }
      #root { min-height: 100vh; min-height: 100dvh; }
      .boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        min-height: 100vh;
        min-height: 100dvh;
        background: linear-gradient(160deg, #eef3ff 0%, #fdf0f6 45%, #e8f4ff 100%);
      }
      html.dark .boot {
        background: linear-gradient(160deg, #0a0f24 0%, #140b1e 55%, #08122b 100%);
      }
      .boot-logo { width: 64px; height: 64px; animation: boot-pulse 1.4s ease-in-out infinite; }
      .boot-dots { display: flex; gap: 8px; }
      .boot-dots i {
        width: 9px; height: 9px; border-radius: 50%;
        background: #1546dd; opacity: .3;
        animation: boot-blink 1.2s infinite;
      }
      .boot-dots i:nth-child(2) { animation-delay: .2s; }
      .boot-dots i:nth-child(3) { animation-delay: .4s; }
      html.dark .boot-dots i { background: #6f9bff; }
      @keyframes boot-blink {
        0%, 80%, 100% { opacity: .25; transform: translateY(0); }
        40% { opacity: 1; transform: translateY(-4px); }
      }
      @keyframes boot-pulse {
        0%, 100% { transform: scale(1); opacity: .9; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      .boot-fallback {
        text-align: center;
        font-family: system-ui, sans-serif;
        color: #4a5578;
        font-size: 14px;
        max-width: 260px;
      }
      html.dark .boot-fallback { color: #aab6d8; }
    </style>
    <!-- 🔄 Худкор аз нав кушодан (ислоҳи «экран мемонад» — талаби соҳиб
         09.11.2026): агар JS дар роҳи суст БУРИДА шуда бошад (пурсиш овезон
         монда, индиcатор то20s мемонад) → ЯК бор бозхонӣ ба таври худкор.
         sessionStorage = танҳо1 маротиба дар як таб (такрори беҳуда манъ);
         ҳангоми муваффақият (React .boot-ро иваз кард) → пардохт пок
         мешавад → дар оянда ҳам имконияти такрор ҳаст. -->
    <script>
      (function () {
        try {
          var KEY = "boot_retry_done";
          var mounted = function () { return !document.querySelector(".boot"); };
          var iv = setInterval(function () {
            if (mounted()) {
              clearInterval(iv);
              try { sessionStorage.removeItem(KEY); } catch (e) {}
            }
          }, 1000);
          setTimeout(function () {
            if (!mounted()) {
              var had = false;
              try { had = sessionStorage.getItem(KEY) === "1"; } catch (e) {}
              if (!had) {
                try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
                location.reload();
              }
            }
          }, 20000);
        } catch (e) { /* беҳатар */ }
      })();
    </script>
    <script>
      // 🌙 Мавзӯи нигоҳдоришуда → ПЕШ аз аввали ранг (бе "флеш"-и сафед)
      //    ?theme=dark | light — пайванди мустақим (масалан барои санҷиш)
      try {
        var q = new URLSearchParams(location.search).get("theme");
        if (q === "dark" || q === "light") localStorage.setItem("danatel_theme", q);
        if (localStorage.getItem("danatel_theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- ⏳ Пеш аз боргирӣ: логотип + нуқтаҳо → React аввалин render-ро
           гузошта, ин блокро иваз мекунад (сабаби экранҳои сиёҳ/холӣ
           ҳангоми боргирӣ дар роҳи суст — талаби соҳиб09.11.2026) -->
      <div class="boot" role="status" aria-label="Боргирӣ">
        <img class="boot-logo" src="/favicon.svg" alt="donatshop" />
        <div class="boot-dots" aria-hidden="true"><i></i><i></i><i></i></div>
        <noscript>
          <p class="boot-fallback">JavaScript кушода кунед — сайт бе он кор намекунад.</p>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
