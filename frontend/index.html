<!doctype html>
<html lang="tj">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="donatshop.tj — Донати бозиҳо: Free Fire, PUBG Mobile, Mobile Legends" />
    <meta name="theme-color" content="#1546dd" />
    <!-- 📦 PWA — насби барнома дар телефон (Install app / Add to Home Screen) -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="donatshop" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>donatshop.tj — Донати бозиҳо</title>
    <!-- ⏳ Индиcатори боргирӣ — то замони пурра бор шудани JS (6-15 сония
         дар роҳҳои суст; экран сиёҳ/холӣ НАБОЯД бошад). React ҳамонавқт ки
         аввалин саҳифаро месозад, дохили #root-ро пурра иваз мекунад →
         индиcатор худкор нест мешавад. Матн надорад → забон умумӣ. -->
    <style>
      html, body { margin: 0; padding: 0; }
      #root { min-height: 100vh; min-height: 100dvh; }
      .boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        min-height: 100vh;
        min-height: 100dvh;
        background: linear-gradient(160deg, #eef3ff 0%, #fdf0f6 45%, #e8f4ff 100%);
      }
      html.dark .boot {
        background: linear-gradient(160deg, #0a0f24 0%, #140b1e 55%, #08122b 100%);
      }
      .boot-logo { width: 64px; height: 64px; animation: boot-pulse 1.4s ease-in-out infinite; }
      .boot-dots { display: flex; gap: 8px; }
      .boot-dots i {
        width: 9px; height: 9px; border-radius: 50%;
        background: #1546dd; opacity: .3;
        animation: boot-blink 1.2s infinite;
      }
      .boot-dots i:nth-child(2) { animation-delay: .2s; }
      .boot-dots i:nth-child(3) { animation-delay: .4s; }
      html.dark .boot-dots i { background: #6f9bff; }
      @keyframes boot-blink {
        0%, 80%, 100% { opacity: .25; transform: translateY(0); }
        40% { opacity: 1; transform: translateY(-4px); }
      }
      @keyframes boot-pulse {
        0%, 100% { transform: scale(1); opacity: .9; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      .boot-fallback {
        text-align: center;
        font-family: system-ui, sans-serif;
        color: #4a5578;
        font-size: 14px;
        max-width: 260px;
      }
      html.dark .boot-fallback { color: #aab6d8; }
      .boot-status {
        margin-top: 14px;
        text-align: center;
        font: 600 12.5px/1.45 system-ui, sans-serif;
        color: #4a5578;
        max-width: 250px;
      }
      html.dark .boot-status { color: #aab6d8; }
      .boot-retry-btn {
        margin-top: 16px;
        padding: 12px 24px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: #fff;
        font: 700 14px/1 system-ui, sans-serif;
        cursor: pointer;
        box-shadow: 0 10px 22px -10px rgba(37, 99, 235, 0.95);
        transition: transform 0.12s ease;
      }
      .boot-retry-btn:active { transform: scale(0.97); }
      .boot-retry-btn:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    </style>
    <!-- 🔄 Худкор бозхонӣ v3 (талаби соҳиб 16.11.2026 — скриншот
         «Такрори боргирӣ 3 аз 3» + «haminro isloh kun»):
         v2 (09.11.2026) ҳар 20s бозхонӣ мекард, ҳатто ҳангоми боршавии
         ФАЪОЛ — дар интернети суст ҳар бор пешрафт партофта мешуд →
         3/3 тамом → матн бо «(F5)» бе тугма (дар телефон кор намекард).
         v3:
         (1) Дарҳоли фаъол (HTML/скрипт ҳанӯз меоянд) → БОЗХОНӢ НАМЕКУНАД,
             сабр мекунад (то 60s) — пешрафт нобуд НАМЕШАВАД;
         (2) Шикасти дархости скрипт → бозхонии зуд (≥1.5s);
         (3) Скрипт омад, вале React нанишаст (хатои барнома) → ≥6s баъд
             бозхонӣ, бе интизории беҳуда;
         (4) 15s ҳеч чиз намеояд (stalled) → бозхонӣ; ҳадди умумӣ 60s;
         (5) Ҳамаи кӯшишҳо тамом → матн + ТУГМАИ «Аз нав кӯшиш кунед»
             (touch/клавиатура; шумораи такрорҳоро пок → аз сифр).
         sessionStorage = шумораи такрорҳо (ҳалқаи беҳуда манъ); ҳангоми
         муваффақият пардохт пок мешавад → дар оянда ҳам такрор мемонад. -->
    <script>
      (function () {
        try {
          var KEY = "boot_retry_n";
          var MAX = 3;
          var n = 0;
          try {
            n = parseInt(sessionStorage.getItem(KEY) || "0", 10) || 0;
          } catch (e) {}
          if (n < 0 || n > MAX) n = 0;
          var t0 = Date.now();
          var failed = false;
          var loaded = false;
          var done = false;
          var mounted = function () {
            return !document.querySelector(".boot");
          };
          var say = function (text) {
            var boot = document.querySelector(".boot");
            if (!boot) return null;
            var s = document.getElementById("boot-status");
            if (!s) {
              s = document.createElement("p");
              s.id = "boot-status";
              s.className = "boot-status";
              s.setAttribute("role", "status");
              boot.appendChild(s);
            }
            s.textContent = text;
            return s;
          };
          // (2) Шикасти дархост (скрипт/лимс) — capture, дарҳол маълум
          window.addEventListener(
            "error",
            function (ev) {
              var t = ev.target;
              if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK")) failed = true;
            },
            true
          );
          var pending = function () {
            if (document.readyState === "loading") return true;
            var m = document.querySelector("script[type=module]");
            if (!m || loaded || failed) return false;
            if (!m._bootWatch) {
              m._bootWatch = true;
              m.addEventListener("load", function () {
                loaded = true;
              });
              m.addEventListener("error", function () {
                failed = true;
              });
            }
            return true;
          };
          var final = function () {
            if (done) return;
            done = true;
            say("Боргирӣ қатъ шуд — интернетро санҷед.");
            var boot = document.querySelector(".boot");
            if (!boot || document.getElementById("boot-retry-btn")) return;
            var b = document.createElement("button");
            b.id = "boot-retry-btn";
            b.type = "button";
            b.className = "boot-retry-btn";
            b.textContent = "🔄 Аз нав кӯшиш кунед";
            b.addEventListener("click", function () {
              try {
                sessionStorage.removeItem(KEY);
              } catch (e) {}
              location.reload();
            });
            boot.appendChild(b);
          };
          var reloadNow = function () {
            if (done) return;
            if (n >= MAX) return final();
            var ok = true;
            try {
              sessionStorage.setItem(KEY, String(n + 1));
            } catch (e) {
              ok = false;
            }
            if (ok) location.reload();
            else final();
          };
          var said = false;
          var iv = setInterval(function () {
            if (mounted()) {
              clearInterval(iv);
              try {
                sessionStorage.removeItem(KEY);
              } catch (e) {}
              return;
            }
            // DOM тайёр аст (1s) → вазъиятро нишон диҳед, агар такрор рафта бошад
            if (n > 0 && !said && !done) {
              said = true;
              say("Такрори боргирӣ " + n + " аз " + MAX + "…");
            }
          }, 1000);
          var ck = setInterval(function () {
            if (mounted() || done) return;
            var el = Date.now() - t0;
            if (failed && el > 1500) return reloadNow(); // (2)
            if (loaded && el > 6000) return reloadNow(); // (3)
            if (pending()) {
              if (el > 60000) reloadNow(); // (1) фаъол — сабр то 60s
            } else if (el > 15000) {
              reloadNow(); // (4) stalled
            }
          }, 2000);
        } catch (e) { /* беҳатар */ }
      })();
    </script>
    <script>
      // 🌙 Мавзӯи нигоҳдоришуда → ПЕШ аз аввали ранг (бе "флеш"-и сафед)
      //    ?theme=dark | light — пайванди мустақим (масалан барои санҷиш)
      try {
        var q = new URLSearchParams(location.search).get("theme");
        if (q === "dark" || q === "light") localStorage.setItem("danatel_theme", q);
        if (localStorage.getItem("danatel_theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- ⏳ Пеш аз боргирӣ: логотип + нуқтаҳо → React аввалин render-ро
           гузошта, ин блокро иваз мекунад (сабаби экранҳои сиёҳ/холӣ
           ҳангоми боргирӣ дар роҳи суст — талаби соҳиб09.11.2026) -->
      <div class="boot" role="status" aria-label="Боргирӣ">
        <img class="boot-logo" src="/favicon.svg" alt="donatshop" />
        <div class="boot-dots" aria-hidden="true"><i></i><i></i><i></i></div>
        <noscript>
          <p class="boot-fallback">JavaScript кушода кунед — сайт бе он кор намекунад.</p>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
